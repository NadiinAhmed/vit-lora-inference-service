# ML CI/CD for the ViT inference service.
#
#   test ──► model-validation ──► docker-build ──► deploy (push to main only)
#
# Training is NOT run here: it is an offline GPU step (training/). This pipeline
# consumes its output, the quantized model published as GitHub Release
# $MODEL_VERSION and pinned by SHA-256 in model_artifact.sha256.
name: ML CI/CD

on:
  push:
    branches: [main, develop]        # integration + production branches
  pull_request:
    branches: [main, develop]        # validate every change before it is merged
  workflow_dispatch:                 # manual "Run workflow" button (validation only, never deploys)

permissions:
  contents: read                     # least privilege; jobs that publish ask for more

env:
  PYTHON_VERSION: "3.11"
  TORCH_VERSION: "2.14.0"
  MODEL_VERSION: model-v1.0.0        # GitHub Release that holds the serving model
  MIN_ACCURACY: "0.85"               # model quality gate (held-out test set, INT8 model)
  MIN_MACRO_F1: "0.80"
  MAX_ACCURACY_DROP: "0.01"          # largest FP32 -> INT8 accuracy loss allowed
  SMOKE_IMAGE: tests/assets/sample.jpg
  SMOKE_EXPECTED_LABEL: cardboard    # true class of SMOKE_IMAGE

jobs:
  # 1) Is the CODE correct? Fast tests with a tiny random ViT, no model download.
  test:
    name: Unit & API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install CPU-only PyTorch
        run: pip install torch==${{ env.TORCH_VERSION }} --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-train.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # 2) Is the MODEL correct? Fetch the pinned artifact, verify it, gate on its metrics, run it.
  model-validation:
    name: Model artifact validation
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install CPU-only PyTorch
        run: pip install torch==${{ env.TORCH_VERSION }} --index-url https://download.pytorch.org/whl/cpu

      - name: Install serving + test dependencies
        run: pip install -r requirements-dev.txt

      - name: Download model artifact ${{ env.MODEL_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models/quantized
          gh release download "$MODEL_VERSION" --repo "$GITHUB_REPOSITORY" --dir models/quantized
          ls -la models/quantized

      - name: Verify model integrity (SHA-256)
        run: sha256sum --check model_artifact.sha256

      - name: Model quality gate
        run: >
          python scripts/check_model_metrics.py
          --min-accuracy "$MIN_ACCURACY"
          --min-macro-f1 "$MIN_MACRO_F1"
          --max-accuracy-drop "$MAX_ACCURACY_DROP"

      - name: Real-model inference test
        run: pytest tests/test_real_model.py -v -rs

      - name: Pass the verified model to the next job
        uses: actions/upload-artifact@v4
        with:
          name: model-quantized
          path: models/quantized/
          retention-days: 1

  # 3) Is the SERVICE correct? Build the image with the verified model and call it over HTTP.
  docker-build:
    name: Build & smoke-test Docker image
    needs: model-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write                # only used on main, to publish the image
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Get the verified model
        uses: actions/download-artifact@v4
        with:
          name: model-quantized
          path: models/quantized

      - name: Re-verify model integrity
        run: sha256sum --check model_artifact.sha256

      - name: Set image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "model.version=${MODEL_VERSION}" \
            -t "$IMAGE:${{ github.sha }}" .
          docker image ls "$IMAGE"

      - name: Start container
        run: docker run -d --name inference -p 8000:8000 "$IMAGE:${{ github.sha }}"

      - name: Smoke test (/health, /predict)
        run: bash scripts/smoke_test.sh http://localhost:8000 "$SMOKE_IMAGE" "$SMOKE_EXPECTED_LABEL"

      - name: Container logs
        if: always()
        run: docker logs inference || true

      - name: Publish image to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"

  # 4) Is the RELEASE correct? Deploy the exact published image, verify it, then promote it.
  deploy:
    name: Deploy & verify (production)
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/pkgs/container/vit-lora-inference-service
    steps:
      - name: Check out the code (smoke-test script and sample image only)
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull the exact image built and tested for this commit
        run: |
          docker pull "$IMAGE:${{ github.sha }}"
          echo "model.version = $(docker inspect -f '{{ index .Config.Labels "model.version" }}' "$IMAGE:${{ github.sha }}")"

      - name: Deploy (start the service)
        run: docker run -d --name inference -p 8000:8000 --restart unless-stopped "$IMAGE:${{ github.sha }}"

      - name: Verify deployment (smoke test)
        run: bash scripts/smoke_test.sh http://localhost:8000 "$SMOKE_IMAGE" "$SMOKE_EXPECTED_LABEL"

      - name: Verify Docker HEALTHCHECK reports healthy
        run: |
          for _ in $(seq 1 24); do
            status="$(docker inspect -f '{{ .State.Health.Status }}' inference)"
            echo "container health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Promote image to :latest
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Container logs
        if: always()
        run: docker logs inference || true
